<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Sornam AI mark">
  <defs>
    <linearGradient id="sornamGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6D1F"/>
      <stop offset="0.45" stop-color="#C9A227"/>
      <stop offset="0.75" stop-color="#E7C25C"/>
      <stop offset="1" stop-color="#FBEDB4"/>
    </linearGradient>
  </defs>
  <g transform="translate(10,-4)">
    <!-- gem outline -->
    <path d="M50,46 L90,46 L114,72 L70,122 L26,72 Z" fill="url(#sornamGold)"/>
    <!-- bright crown highlight facet -->
    <path d="M50,46 L62,72 L26,72 Z" fill="#FBEDB4" opacity="0.55"/>
    <!-- facet lines -->
    <g stroke="#5E4715" stroke-width="1.3" stroke-linejoin="round" fill="none" opacity="0.55">
      <path d="M26,72 L114,72"/>
      <path d="M50,46 L62,72"/>
      <path d="M90,46 L78,72"/>
      <path d="M62,72 L70,122"/>
      <path d="M78,72 L70,122"/>
      <path d="M26,72 L70,122"/>
      <path d="M114,72 L70,122"/>
      <path d="M50,46 L26,72"/>
      <path d="M90,46 L114,72"/>
    </g>
    <!-- intelligence spark -->
    <path d="M120,40 l3,7 l7,3 l-7,3 l-3,7 l-3,-7 l-7,-3 l7,-3 z" fill="url(#sornamGold)"/>
  </g>
</svg>
